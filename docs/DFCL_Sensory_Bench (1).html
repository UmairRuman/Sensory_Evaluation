<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>DFCL Sensory Bench</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --maroon:#7A1F2B;
  --maroon-dark:#59151E;
  --gold:#C89B3C;
  --gold-light:#E8D6A8;
  --paper:#FAF6EE;
  --paper-dim:#F1EADA;
  --ink:#2B211E;
  --ink-soft:#6B5D53;
  --line:#DCCFB8;
  --below:#B5533C;
  --target:#3E7A4C;
  --above:#B5533C;
  --white:#FFFFFF;
  --radius:10px;
  --shadow:0 2px 10px rgba(43,33,30,0.10);
  --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--paper);display:flex;flex-direction:column;position:relative;}

/* ===== Header / chrome ===== */
.topbar{
  background:var(--maroon);
  color:var(--gold-light);
  padding:16px 18px 14px;
  position:sticky;top:0;z-index:20;
  box-shadow:0 2px 8px rgba(0,0,0,0.18);
}
.topbar .brand{
  font-family:var(--serif);
  font-size:12px;
  letter-spacing:0.14em;
  color:var(--gold);
  margin:0 0 3px;
  text-transform:uppercase;
}
.topbar h1{
  font-family:var(--serif);
  font-size:22px;
  margin:0;
  color:var(--white);
  font-weight:600;
  line-height:1.25;
}
.topbar .sub{
  font-size:12.5px;
  color:var(--gold-light);
  opacity:0.85;
  margin-top:3px;
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.back-btn{
  background:none;border:1px solid rgba(232,214,168,0.4);color:var(--gold-light);
  border-radius:20px;padding:6px 13px;font-size:13px;cursor:pointer;font-family:var(--sans);
  flex-shrink:0;
}
.back-btn:active{background:rgba(255,255,255,0.08);}

/* ===== Layout ===== */
.screen{padding:20px 18px 90px;flex:1;}
.card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}
.card h2{font-family:var(--serif);font-size:17px;margin:0 0 4px;color:var(--maroon-dark);}
.card p.hint{font-size:13px;color:var(--ink-soft);margin:0 0 12px;line-height:1.5;}
.section-label{
  font-family:var(--serif);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--ink-soft);margin:22px 0 8px;
}
.section-label:first-child{margin-top:0;}

/* ===== Buttons ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-family:var(--sans);font-size:15px;font-weight:600;
  border-radius:9px;border:none;cursor:pointer;padding:13px 18px;
  width:100%;
}
.btn-primary{background:var(--maroon);color:var(--white);}
.btn-primary:active{background:var(--maroon-dark);}
.btn-primary:disabled{background:#C9B8B8;cursor:not-allowed;}
.btn-gold{background:var(--gold);color:var(--maroon-dark);}
.btn-gold:active{background:#B78A2D;}
.btn-outline{background:none;border:1.5px solid var(--maroon);color:var(--maroon);}
.btn-outline:active{background:rgba(122,31,43,0.06);}
.btn-ghost{background:none;color:var(--ink-soft);text-decoration:underline;padding:8px;font-weight:500;font-size:13.5px;}
.btn-danger{background:none;color:var(--below);border:1.5px solid var(--below);}
.btn-sm{padding:8px 12px;font-size:13px;width:auto;}
.row-btns{display:flex;gap:10px;}
.row-btns .btn{flex:1;}

/* ===== Choice lists ===== */
.choice-list{display:flex;flex-direction:column;gap:9px;}
.choice{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:1.5px solid var(--line);border-radius:9px;padding:14px 15px;
  background:var(--white);cursor:pointer;
}
.choice.selected{border-color:var(--maroon);background:#FBF1F2;}
.choice .name{font-size:15px;font-weight:600;color:var(--ink);}
.choice .meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.choice .checkmark{
  width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
}
.choice.selected .checkmark{background:var(--maroon);border-color:var(--maroon);}
.choice.selected .checkmark::after{content:'✓';color:white;font-size:12px;}

/* ===== Form fields ===== */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;letter-spacing:0.01em;}
.field input[type=text],.field input[type=number],.field select,.field textarea{
  width:100%;border:1.5px solid var(--line);border-radius:8px;padding:11px 12px;
  font-size:15px;font-family:var(--sans);background:var(--white);color:var(--ink);
}
.field textarea{resize:vertical;min-height:60px;}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--maroon);}
.gender-row{display:flex;gap:8px;}
.gender-row button{
  flex:1;padding:11px 6px;border-radius:8px;border:1.5px solid var(--line);background:var(--white);
  font-size:13.5px;cursor:pointer;color:var(--ink);
}
.gender-row button.active{background:var(--maroon);border-color:var(--maroon);color:white;}

/* ===== Tabs (parent parameters) ===== */
.tabstrip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 14px;-webkit-overflow-scrolling:touch;}
.tabstrip::-webkit-scrollbar{display:none;}
.tab{
  flex-shrink:0;padding:9px 14px;border-radius:20px;font-size:13px;font-weight:600;
  background:var(--paper-dim);color:var(--ink-soft);border:1.5px solid transparent;cursor:pointer;
  white-space:nowrap;
}
.tab.active{background:var(--maroon);color:white;}
.tab.done{border-color:var(--gold);}
.tab.done::after{content:' ✓';font-size:11px;}

/* ===== Attribute scoring card ===== */
.attr-card{border:1px solid var(--line);border-radius:9px;padding:14px 14px 12px;margin-bottom:12px;background:var(--white);}
.attr-card .attr-name{font-weight:700;font-size:14.5px;color:var(--ink);margin-bottom:9px;}
.scale{display:flex;gap:5px;margin-bottom:8px;}
.scale button{
  flex:1;aspect-ratio:1;border-radius:8px;border:1.5px solid var(--line);background:var(--white);
  font-size:16px;font-weight:700;color:var(--ink-soft);cursor:pointer;
}
.scale button.sel-below{background:var(--below);border-color:var(--below);color:white;}
.scale button.sel-target{background:var(--target);border-color:var(--target);color:white;}
.scale button.sel-above{background:var(--above);border-color:var(--above);color:white;}
.descriptors{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-soft);gap:4px;line-height:1.3;}
.descriptors span{flex:1;text-align:center;}
.descriptors span:first-child{text-align:left;}
.descriptors span:last-child{text-align:right;}

/* personalize: attribute row w/ toggle */
.pcard{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin-bottom:8px;background:var(--white);}
.pcard.off{opacity:0.45;}
.switch{width:38px;height:22px;border-radius:12px;background:var(--line);position:relative;flex-shrink:0;cursor:pointer;margin-top:2px;}
.switch.on{background:var(--target);}
.switch::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:white;top:2px;left:2px;transition:left .15s;}
.switch.on::after{left:18px;}
.pcard .pname{font-size:14px;font-weight:600;}
.pcard .pnote{font-size:11.5px;color:var(--ink-soft);margin-top:2px;line-height:1.4;}
.section-toggle{display:flex;align-items:center;justify-content:space-between;background:var(--paper-dim);border-radius:8px;padding:10px 12px;margin:14px 0 8px;}
.section-toggle .stitle{font-family:var(--serif);font-weight:700;font-size:14.5px;color:var(--maroon-dark);}

/* ===== Sample chips ===== */
.sample-list{display:flex;flex-direction:column;gap:8px;}
.sample-row{display:flex;align-items:center;gap:8px;}
.sample-row input{flex:1;}
.chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--paper-dim);border-radius:16px;
  padding:6px 12px;font-size:12.5px;color:var(--ink);border:1px solid var(--line);
}
.chip .x{cursor:pointer;color:var(--below);font-weight:700;}

/* ===== QR block ===== */
.qr-wrap{text-align:center;padding:10px 0 4px;}
.qr-wrap canvas{border:6px solid white;box-shadow:var(--shadow);border-radius:8px;}
.code-display{
  font-family:var(--serif);font-size:28px;letter-spacing:0.08em;color:var(--maroon-dark);
  text-align:center;margin:14px 0 4px;font-weight:700;
}
.code-hint{text-align:center;font-size:12px;color:var(--ink-soft);margin-bottom:6px;}

/* ===== Dashboard ===== */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px;}
.stat-box{background:var(--paper-dim);border-radius:8px;padding:12px;text-align:center;}
.stat-box .num{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--maroon-dark);}
.stat-box .lbl{font-size:11px;color:var(--ink-soft);margin-top:2px;text-transform:uppercase;letter-spacing:0.06em;}
table.rank-table{width:100%;border-collapse:collapse;font-size:12.5px;}
table.rank-table th,table.rank-table td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);}
table.rank-table th{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.04em;}
table.rank-table td:first-child,table.rank-table th:first-child{text-align:left;}
.rank-badge{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:50%;background:var(--gold);color:var(--maroon-dark);font-weight:700;font-size:11px;}
.panel-entry{border-bottom:1px solid var(--line);padding:10px 0;font-size:13px;}
.panel-entry:last-child{border-bottom:none;}
.panel-entry .pname{font-weight:700;}
.panel-entry .pmeta{color:var(--ink-soft);font-size:11.5px;}
canvas.chart-canvas{max-width:100%;}

/* ===== Toast / empty ===== */
.empty{text-align:center;padding:40px 20px;color:var(--ink-soft);}
.empty .big{font-size:38px;margin-bottom:10px;}
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:white;padding:10px 20px;border-radius:20px;font-size:13px;
  z-index:100;box-shadow:var(--shadow);
}
.footer-bar{
  position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);
  padding:12px 18px;display:flex;gap:10px;z-index:15;
}
.progress-dots{display:flex;justify-content:center;gap:6px;margin:6px 0 2px;}
.progress-dots span{width:6px;height:6px;border-radius:50%;background:var(--line);}
.progress-dots span.on{background:var(--maroon);}
</style>
</head>

<script>
/* ============ STORAGE HELPERS ============ */
let STORAGE_OK = true;
async function storeGet(key, shared){
  try{ const r = await window.storage.get(key, !!shared); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function storeSet(key, value, shared){
  try{
    const r = await window.storage.set(key, JSON.stringify(value), !!shared);
    if(!r) STORAGE_OK = false;
    return !!r;
  }
  catch(e){ STORAGE_OK = false; return false; }
}
async function storeList(prefix, shared){
  try{ const r = await window.storage.list(prefix, !!shared); return r ? r.keys : []; }
  catch(e){ return []; }
}
async function checkStorageAvailable(){
  if(typeof window.storage === 'undefined' || !window.storage){ STORAGE_OK = false; return false; }
  try{
    const testKey = '__storage_check__';
    const ok = await window.storage.set(testKey, JSON.stringify({t:Date.now()}), false);
    if(!ok){ STORAGE_OK = false; return false; }
    STORAGE_OK = true;
    return true;
  }catch(e){ STORAGE_OK = false; return false; }
}

function genId(len){
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let s = '';
  for(let i=0;i<len;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function nowIso(){ return new Date().toISOString(); }
function fmtDate(iso){
  try{ const d = new Date(iso); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return iso; }
}
function scoreClass(v){
  if(v===3) return 'sel-target';
  if(v===1||v===2) return 'sel-below';
  return 'sel-above';
}
function avg(arr){ if(!arr.length) return 0; return arr.reduce((a,b)=>a+b,0)/arr.length; }
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* Heuristic: does a starred attribute's footnote apply to this product? */
const STOP_WORDS = ['bread','cake','bun','kebab','rusk','naan','samosa','topping','toppings',
  'paratha','parathas','shawarma','tortilla','sheermal','chicken','products','product','plain','only'];
function tokensOf(name){
  return name.toLowerCase().split(/[\s\/\(\),]+/).filter(t => t.length>3 && !STOP_WORDS.includes(t));
}
/* Scan text for known full product names, longest-match-first (masking each match so a
   short name like "Burger Bun" can't be falsely found inside a longer sibling name like
   "Brioche Burger Bun"). Returns the exact names found, plus the leftover text with those
   matches blanked out - used for a word-overlap fallback that catches abbreviated mentions
   like "Wholewheat & Multigrain only" (missing the trailing "Bread"). */
function scanProducts(text, allProducts){
  const sorted = [...allProducts].sort((a,b)=>b.length-a.length);
  const found = [];
  let leftover = text;
  sorted.forEach(q=>{
    const ql = q.toLowerCase();
    if(ql && leftover.includes(ql)){
      found.push(q);
      leftover = leftover.split(ql).join(' '.repeat(ql.length));
    }
  });
  return {found, leftover};
}
function attributeApplies(attr, section, productName, allProducts){
  if(!attr.stars) return true;
  const note = (section.notes||[]).find(n => n.stars===attr.stars);
  if(!note) return true;
  const text = note.text.toLowerCase();
  const skipMatch = text.match(/skip for ([^.;]+)/);
  const skipText = skipMatch ? skipMatch[1] : '';
  const restText = skipMatch ? text.replace(skipMatch[0],'') : text;
  const toks = tokensOf(productName);

  const skipScan = scanProducts(skipText, allProducts);
  if(skipScan.found.includes(productName)) return false;
  if(toks.some(t => skipScan.leftover.includes(t))) return false;

  const restScan = scanProducts(restText, allProducts);
  if(restScan.found.includes(productName)) return true;
  if(toks.some(t => restScan.leftover.includes(t))) return true;
  // some other specific product(s) were named and this one wasn't - not applicable
  if(restScan.found.length) return false;
  // note names no product at all (fully generic wording) - default to applicable
  return true;
}

  state.toast = msg;

function getUrlSession(){
  try{
    const url = new URL(window.location.href);
    const q = url.searchParams.get('session');
    if(q) return q.toUpperCase();
    const h = window.location.hash.match(/session=([A-Z0-9]+)/i);
    if(h) return h[1].toUpperCase();
  }catch(e){}
  return null;
}

/* ============ SECTION BUILDING (host personalization defaults) ============ */
function buildDefaultSections(categoryKey, productNames){
  const cat = CATEGORIES.find(c=>c.key===categoryKey);
  if(!cat) return [];
  return cat.sections.map(sec => {
    const attrs = sec.attributes.map(a => {
      let on = false;
      if(!productNames || !productNames.length){ on = !a.stars; }
      else { on = productNames.some(p => attributeApplies(a, sec, p, cat.products)); }
      return Object.assign({}, a, {on});
    });
    return {letter:sec.letter, name:sec.name, notes:sec.notes||[], on:true, attributes:attrs};
  });
}

/* ============ RENDER ROOT ============ */
function render(){
  const app = document.getElementById('app');
  let html = '';
  switch(state.screen){
    case 'landing': html = renderLanding(); break;
    case 'hostNewCategory': html = renderHostNewCategory(); break;
    case 'hostNewProducts': html = renderHostNewProducts(); break;
    case 'hostNewPersonalize': html = renderHostNewPersonalize(); break;
    case 'hostPublish': html = renderHostPublish(); break;
    case 'hostSessions': html = renderHostSessions(); break;
    case 'hostDashboard': html = renderHostDashboard(); break;
    case 'joinCode': html = renderJoinCode(); break;
    case 'joinCredentials': html = renderJoinCredentials(); break;
    case 'joinProduct': html = renderJoinProduct(); break;
    case 'joinSample': html = renderJoinSample(); break;
    case 'joinScore': html = renderJoinScore(); break;
    case 'joinDone': html = renderJoinDone(); break;
    default: html = renderLanding();
  }
  if(state.toast) html += `<div class="toast">${escapeHtml(state.toast)}</div>`;
  app.innerHTML = html;
  postRender();
}

function postRender(){
  // QR canvas
  const qrCanvas = document.getElementById('qr-canvas');
  if(qrCanvas && window.QRious && state.hostSession){
    const url = buildJoinUrl(state.hostSession.id);
    new QRious({ element: qrCanvas, value: url, size: 220, background:'#ffffff', foreground:'#2B211E', level:'M' });
  }
  // Charts
  if(state._chartData && window.Chart){
    drawCharts(state._chartData);
  }
  // autofocus first text input on credential screen
  const firstInput = document.querySelector('[data-autofocus]');
  if(firstInput) firstInput.focus();
}

function buildJoinUrl(sessionId){
  let base = window.location.href.split('#')[0].split('?')[0];
  return base + '?session=' + sessionId;
}
/* If this page is being previewed inside Claude (an unpublished artifact), its address
   is a sandboxed location like about:srcdoc or a blob: URL - not a real link anyone
   else's device can open. Only a genuine http(s) address can work as a QR/link. */
function joinUrlIsShareable(){
  try{
    const href = window.location.href;
    return /^https?:\/\//i.test(href) && !/srcdoc/i.test(href);
  }catch(e){ return false; }
}

/* ============ EVENT DELEGATION ============ */
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.getAttribute('data-action');
  const arg = el.getAttribute('data-arg');
  const arg2 = el.getAttribute('data-arg2');
  if(typeof ACTIONS[action] === 'function') ACTIONS[action](arg, arg2, el);
});
document.addEventListener('input', function(e){
  const el = e.target.closest('[data-bind]');
  if(!el) return;
  const path = el.getAttribute('data-bind');
  bindSet(path, el.value);
});

function bindSet(path, value){
  const parts = path.split('.');
  let obj = state;
  for(let i=0;i<parts.length-1;i++){ obj = obj[parts[i]]; }
  obj[parts[parts.length-1]] = value;
}

/* ============ ACTIONS ============ */
const ACTIONS = {
  goto: (arg)=>{ if(arg==='hostSessions') _hostSessionsCache=null; setState({screen: arg}); },

  startNewSession: ()=>{
    setState({screen:'hostNewCategory', build:{categoryKey:null, products:[], sections:null}});
  },

  pickCategory: (key)=>{
    state.build.categoryKey = key;
    state.build.products = [];
    setState({screen:'hostNewProducts'});
  },

  toggleBuildProduct: (name)=>{
    const idx = state.build.products.findIndex(p=>p.name===name);
    if(idx>=0){ state.build.products.splice(idx,1); }
    else { state.build.products.push({name, samples:[]}); }
    render();
  },

  addSample: (productName)=>{
    const p = state.build.products.find(p=>p.name===productName);
    if(!p) return;
    const n = p.samples.length;
    const letter = String.fromCharCode(65+n);
    p.samples.push({code:'Sample '+letter, label:''});
    render();
  },
  removeSample: (productName, idxStr)=>{
    const p = state.build.products.find(p=>p.name===productName);
    if(!p) return;
    p.samples.splice(parseInt(idxStr,10),1);
    render();
  },
  updateSampleCode: (productName, idxStr, el)=>{
    const p = state.build.products.find(p=>p.name===productName);
    if(!p) return;
    p.samples[parseInt(idxStr,10)].code = el.value;
  },
  updateSampleLabel: (productName, idxStr, el)=>{
    const p = state.build.products.find(p=>p.name===productName);
    if(!p) return;
    p.samples[parseInt(idxStr,10)].label = el.value;
  },

  toBuildPersonalize: ()=>{
    if(!state.build.products.length){ showToast('Pick at least one product'); return; }
    const withSamples = state.build.products.filter(p=>p.samples.length>0);
    if(!withSamples.length){ showToast('Add at least one sample'); return; }
    state.build.products = withSamples;
    if(!state.build.sections){
      state.build.sections = buildDefaultSections(state.build.categoryKey, state.build.products.map(p=>p.name));
    }
    setState({screen:'hostNewPersonalize'});
  },

  toggleSection: (letter)=>{
    const sec = state.build.sections.find(s=>s.letter===letter);
    sec.on = !sec.on;
    render();
  },
  toggleAttr: (letter, attrId)=>{
    const sec = state.build.sections.find(s=>s.letter===letter);
    const a = sec.attributes.find(a=>a.id===attrId);
    a.on = !a.on;
    render();
  },

  publishSession: async ()=>{
    const enabledSections = state.build.sections
      .filter(s=>s.on)
      .map(s=>({letter:s.letter, name:s.name, attributes:s.attributes.filter(a=>a.on).map(a=>({id:a.id,name:a.name,low:a.low,mid:a.mid,high:a.high}))}))
      .filter(s=>s.attributes.length>0);
    if(!enabledSections.length){ showToast('Enable at least one parameter'); return; }
    const cat = CATEGORIES.find(c=>c.key===state.build.categoryKey);
    const id = genId(6);
    const session = {
      id, categoryKey: state.build.categoryKey, categoryTitle: cat.title,
      products: state.build.products, sections: enabledSections,
      createdAt: nowIso(), status:'open'
    };
    const savedSession = await storeSet('session:'+id, session, true);
    const savedResults = await storeSet('results:'+id, [], true);
    // Don't trust the write call alone - read it back from shared storage. This is what
    // a panelist's device will do when they enter the code, so it's the real test of
    // whether the session actually exists for anyone else.
    const verify = await storeGet('session:'+id, true);
    if(!savedSession || !savedResults || !verify){
      showToast('Could not save the session — storage is unavailable here');
      setState({screen:'hostNewPersonalize'});
      return;
    }
    const mine = (await storeGet('host-sessions', false)) || [];
    mine.unshift({id, categoryTitle: cat.title, createdAt: session.createdAt});
    await storeSet('host-sessions', mine, false);
    setState({screen:'hostPublish', hostSession:session, hostSessionId:id});
  },

  copyLink: ()=>{
    const url = buildJoinUrl(state.hostSession.id);
    navigator.clipboard && navigator.clipboard.writeText(url).then(()=>showToast('Link copied')).catch(()=>showToast(url));
  },

  goDashboard: async (id)=>{
    const sid = id || state.hostSessionId;
    setState({screen:'hostDashboard', hostSessionId: sid, hostSession:null, hostResults:null});
    const session = await storeGet('session:'+sid, true);
    const results = (await storeGet('results:'+sid, true)) || [];
    setState({hostSession:session, hostResults:results});
  },

  loadHostSessions: async ()=>{},

  toggleSessionStatus: async ()=>{
    state.hostSession.status = state.hostSession.status==='open' ? 'closed':'open';
    await storeSet('session:'+state.hostSession.id, state.hostSession, true);
    render();
  },

  deleteSubmission: async (idxStr)=>{
    const idx = parseInt(idxStr,10);
    if(!confirm('Remove this submission?')) return;
    state.hostResults.splice(idx,1);
    await storeSet('results:'+state.hostSession.id, state.hostResults, true);
    render();
  },

  startEditSubmission: (idxStr)=>{
    state.editingSubmission = parseInt(idxStr,10);
    render();
  },
  cancelEditSubmission: ()=>{ state.editingSubmission=null; render(); },
  saveEditSubmission: async (idxStr)=>{
    const idx = parseInt(idxStr,10);
    const sub = state.hostResults[idx];
    document.querySelectorAll('[data-edit-attr]').forEach(inp=>{
      sub.scores[inp.getAttribute('data-edit-attr')] = parseInt(inp.value,10);
    });
    const nameInp = document.querySelector('[data-edit-name]');
    if(nameInp) sub.name = nameInp.value;
    await storeSet('results:'+state.hostSession.id, state.hostResults, true);
    state.editingSubmission = null;
    render();
  },

  exportReport: ()=>{
    exportCSV();
  },

  refreshDashboard: async ()=>{
    const results = (await storeGet('results:'+state.hostSession.id, true)) || [];
    setState({hostResults:results});
    showToast('Refreshed');
  },

  /* ---- join flow ---- */
  loadSessionByCode: async ()=>{
    const code = (state.joinCode||'').trim().toUpperCase();
    if(!code){ showToast('Enter a code'); return; }
    const storageWorks = await checkStorageAvailable();
    if(!storageWorks){ showToast('Cannot connect to storage — try reloading the app'); return; }
    const session = await storeGet('session:'+code, true);
    if(!session){ showToast('Session not found — check the code with your host'); return; }
    if(session.status!=='open'){ showToast('This session is closed'); return; }
    setState({session, screen:'joinCredentials', panelist:{name:'',age:'',gender:'',dept:''}});
  },

  submitCredentials: ()=>{
    if(!state.panelist.name || !state.panelist.name.trim()){ showToast('Enter your name'); return; }
    if(state.session.products.length===1){
      setState({screen:'joinSample', currentProduct: state.session.products[0].name});
    } else {
      setState({screen:'joinProduct'});
    }
  },

  pickJoinProduct: (name)=>{
    setState({screen:'joinSample', currentProduct:name});
  },

  pickSample: (code)=>{
    const p = state.session.products.find(p=>p.name===state.currentProduct);
    const sample = p.samples.find(s=>s.code===code);
    const scores = {};
    setState({screen:'joinScore', currentSample:sample, activeTab:0, scores, comment:''});
  },

  setActiveTab: (idxStr)=>{
    setState({activeTab: parseInt(idxStr,10)});
  },

  scoreAttr: (attrId, valStr)=>{
    state.scores[attrId] = parseInt(valStr,10);
    render();
  },

  nextTab: async ()=>{
    const sections = state.session.sections;
    if(state.activeTab < sections.length-1){
      setState({activeTab: state.activeTab+1});
      window.scrollTo(0,0);
    } else {
      await ACTIONS.submitSample();
    }
  },
  prevTab: ()=>{
    if(state.activeTab>0){ setState({activeTab: state.activeTab-1}); window.scrollTo(0,0); }
    else { setState({screen:'joinSample'}); }
  },

  submitSample: async ()=>{
    if(state.submitting) return;
    const allAttrs = [];
    state.session.sections.forEach(s=>s.attributes.forEach(a=>allAttrs.push(a.id)));
    const missing = allAttrs.filter(id => !(id in state.scores));
    if(missing.length){ showToast('Score every attribute before submitting'); return; }
    // Snapshot everything this save needs BEFORE the first await, so if the panelist (or a
    // fast double-tap) moves on to the next sample while this is in flight, that later
    // navigation can't corrupt or overwrite the data we're about to save here.
    const sessionId = state.session.id;
    const snapshotScores = Object.assign({}, state.scores);
    const snapshotProduct = state.currentProduct;
    const snapshotSample = state.currentSample;
    const snapshotComment = state.comment;
    const snapshotPanelist = Object.assign({}, state.panelist);
    setState({submitting:true});
    const results = (await storeGet('results:'+sessionId, true)) || [];
    results.push({
      panelistId: genId(8),
      name: snapshotPanelist.name, age: snapshotPanelist.age, gender: snapshotPanelist.gender, dept: snapshotPanelist.dept,
      product: snapshotProduct, sampleCode: snapshotSample.code, sampleLabel: snapshotSample.label,
      scores: snapshotScores, comment: snapshotComment,
      submittedAt: nowIso()
    });
    await storeSet('results:'+sessionId, results, true);
    if(!state.completed[snapshotProduct]) state.completed[snapshotProduct]=[];
    state.completed[snapshotProduct].push(snapshotSample.code);
    state.submitting = false;
    if(state.currentSample === snapshotSample){
      setState({screen:'joinSample', scores:{}, comment:''});
    } else {
      render();
    }
    showToast('Saved '+snapshotSample.code);
  },

  finishProduct: ()=>{
    if(state.session.products.length>1){ setState({screen:'joinProduct'}); }
    else { setState({screen:'joinDone'}); }
  },
  allDone: ()=>{ setState({screen:'joinDone'}); },

  startAnother: ()=>{
    setState({screen:'joinCode', joinCode:'', session:null, panelist:null, completed:{}});
  }
};

/* ============ HOST: dashboard ============ */
function allAttrsFlat(session){
  const out = [];
  session.sections.forEach(s=>s.attributes.forEach(a=>out.push(Object.assign({section:s.name},a))));
  return out;
}
function computeRanking(session, results, productName){
  const subs = results.filter(r=>r.product===productName);
  const codes = [...new Set(subs.map(r=>r.sampleCode))];
  const attrs = allAttrsFlat(session);
  const overallAttr = attrs.find(a=>a.name==='Overall Liking');
  return codes.map(code => {
    const rows = subs.filter(r=>r.sampleCode===code);
    const nonOverallAttrs = attrs.filter(a=>a.name!=='Overall Liking');
    const allScores = [];
    rows.forEach(r => nonOverallAttrs.forEach(a=>{ if(a.id in r.scores) allScores.push(r.scores[a.id]); }));
    const avgAttr = avg(allScores);
    const overallScores = overallAttr ? rows.map(r=>r.scores[overallAttr.id]).filter(v=>v!=null) : [];
    const overallAvg = avg(overallScores);
    const composite = (avgAttr + overallAvg) / 2;
    const deviation = Math.abs(avgAttr - 3);
    return {code, n: rows.length, avgAttr, overallAvg, composite, deviation};
  }).sort((a,b)=> b.composite - a.composite)
    .map((r,i)=>Object.assign({},r,{rank:i+1}));
}

function renderHostDashboard(){
  if(!state.hostSession){
    return `<div class="topbar"><div class="topbar-row"><button class="back-btn" data-action="goto" data-arg="landing">‹ Back</button></div><h1 style="margin-top:8px;">Results</h1></div><div class="screen"><div class="empty"><div class="big">⏳</div>Loading session…</div></div>`;
  }
  const session = state.hostSession;
  const results = state.hostResults || [];
  const products = session.products.map(p=>p.name);
  const totalPanelists = new Set(results.map(r=>r.panelistId)).size;

  const productBlocks = products.map(pname => {
    const ranking = computeRanking(session, results, pname);
    const rankRows = ranking.map(r => `
      <tr>
        <td>${escapeHtml(r.code)}</td>
        <td>${r.n}</td>
        <td>${r.avgAttr.toFixed(2)}</td>
        <td>${r.overallAvg.toFixed(2)}</td>
        <td>${r.composite.toFixed(2)}</td>
        <td><span class="rank-badge">${r.rank}</span></td>
      </tr>`).join('');
    const chartId = 'chart-'+pname.replace(/[^a-z0-9]/gi,'');
    if(ranking.length){
      state._chartData = state._chartData || [];
      state._chartData.push({id:chartId, labels: ranking.map(r=>r.code), data: ranking.map(r=>r.avgAttr)});
    }
    return `
    <div class="card">
      <h2 style="font-size:15px;">${escapeHtml(pname)}</h2>
      ${ranking.length ? `
      <div style="margin:8px 0 14px;"><canvas class="chart-canvas" id="${chartId}" height="160"></canvas></div>
      <div style="overflow-x:auto;">
      <table class="rank-table">
        <thead><tr><th>Sample</th><th>n</th><th>Attr avg</th><th>Overall</th><th>Composite</th><th>Rank</th></tr></thead>
        <tbody>${rankRows}</tbody>
      </table>
      </div>` : `<p class="hint">No submissions yet for this product.</p>`}
    </div>`;
  }).join('');

  const submissionRows = results.map((r,idx) => {
    if(state.editingSubmission===idx){
      const attrs = allAttrsFlat(session);
      const inputs = attrs.map(a=>`
        <div class="field" style="margin-bottom:8px;">
          <label>${escapeHtml(a.name)}</label>
          <input type="number" min="1" max="5" value="${r.scores[a.id]!=null?r.scores[a.id]:''}" data-edit-attr="${a.id}">
        </div>`).join('');
      return `
      <div class="card">
        <div class="field"><label>Name</label><input type="text" value="${escapeHtml(r.name)}" data-edit-name></div>
        ${inputs}
        <div class="row-btns">
          <button class="btn btn-outline" data-action="cancelEditSubmission">Cancel</button>
          <button class="btn btn-primary" data-action="saveEditSubmission" data-arg="${idx}">Save</button>
        </div>
      </div>`;
    }
    return `
    <div class="panel-entry">
      <div style="display:flex;justify-content:space-between;">
        <div>
          <div class="pname">${escapeHtml(r.name)} <span class="pmeta">${r.age?('· '+escapeHtml(String(r.age))+'y'):''}${r.gender?(' · '+escapeHtml(r.gender)):''}</span></div>
          <div class="pmeta">${escapeHtml(r.product)} — ${escapeHtml(r.sampleCode)} · ${fmtDate(r.submittedAt)}</div>
          ${r.comment ? `<div class="pmeta" style="font-style:italic;margin-top:2px;">"${escapeHtml(r.comment)}"</div>` : ''}
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          <button class="btn btn-outline btn-sm" data-action="startEditSubmission" data-arg="${idx}">Edit</button>
          <button class="btn btn-danger btn-sm" data-action="deleteSubmission" data-arg="${idx}">Remove</button>
        </div>
      </div>
    </div>`;
  }).join('');

  state._chartData = state._chartData || [];

  return `
  <div class="topbar">
    <div class="topbar-row">
      <button class="back-btn" data-action="goto" data-arg="landing">‹ Home</button>
      <button class="back-btn" data-action="refreshDashboard">↻ Refresh</button>
    </div>
    <h1 style="margin-top:8px;">${escapeHtml(session.categoryTitle)}</h1>
    <div class="sub">Code ${session.id} · ${session.status==='open'?'Open for scoring':'Closed'}</div>
  </div>
  <div class="screen">
    <div class="stat-grid">
      <div class="stat-box"><div class="num">${totalPanelists}</div><div class="lbl">Panelists</div></div>
      <div class="stat-box"><div class="num">${results.length}</div><div class="lbl">Scored samples</div></div>
    </div>
    <div class="row-btns" style="margin:12px 0 6px;">
      <button class="btn btn-outline btn-sm" data-action="toggleSessionStatus">${session.status==='open'?'Close session':'Reopen session'}</button>
      <button class="btn btn-outline btn-sm" data-action="exportReport">Export CSV</button>
    </div>
    <div class="section-label">Results by product</div>
    ${productBlocks}
    <div class="section-label">All submissions</div>
    ${submissionRows || '<p class="hint">No panelists have submitted yet. Share the QR code to get started.</p>'}
  </div>`;
}

function drawCharts(chartList){
  chartList.forEach(cd => {
    const canvas = document.getElementById(cd.id);
    if(!canvas) return;
    if(canvas._chart) canvas._chart.destroy();
    canvas._chart = new Chart(canvas, {
      type:'bar',
      data:{ labels: cd.labels, datasets:[{ label:'Avg attribute score', data: cd.data,
        backgroundColor:'#C89B3C', borderRadius:5 }]},
      options:{
        responsive:true,
        plugins:{ legend:{display:false} },
        scales:{ y:{ min:0, max:5, ticks:{stepSize:1} } }
      }
    });
  });
  state._chartData = null;
}

function exportCSV(){
  const session = state.hostSession, results = state.hostResults||[];
  const attrs = allAttrsFlat(session);
  const header = ['Panelist','Age','Gender','Department','Product','Sample','Submitted', ...attrs.map(a=>a.name), 'Comment'];
  const lines = [header.join(',')];
  results.forEach(r=>{
    const row = [r.name, r.age||'', r.gender||'', r.dept||'', r.product, r.sampleCode, r.submittedAt,
      ...attrs.map(a=> r.scores[a.id]!=null ? r.scores[a.id] : ''), (r.comment||'').replace(/,/g,';')];
    lines.push(row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
  });
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'DFCL_Sensory_'+session.id+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ============ JOIN: code entry ============ */
function renderJoinCode(){
  return `
  <div class="topbar">
    <div class="topbar-row"><button class="back-btn" data-action="goto" data-arg="landing">‹ Back</button></div>
    <h1 style="margin-top:8px;">Join a tasting</h1>
    <div class="sub">Enter the session code from your host</div>
  </div>
  <div class="screen">
    <div class="card">
      <div class="field">
        <label>Session code</label>
        <input type="text" data-autofocus style="text-transform:uppercase;font-size:20px;letter-spacing:0.1em;text-align:center;"
          value="${escapeHtml(state.joinCode)}" oninput="state.joinCode=this.value.toUpperCase()" placeholder="e.g. F3K9QX">
      </div>
      <button class="btn btn-primary" data-action="loadSessionByCode">Continue</button>
    </div>
  </div>`;
}

/* ============ JOIN: credentials ============ */
function renderJoinCredentials(){
  const p = state.panelist;
  const genders = ['Male','Female','Other'];
  return `
  <div class="topbar">
    <div class="topbar-row"><button class="back-btn" data-action="goto" data-arg="joinCode">‹ Back</button></div>
    <h1 style="margin-top:8px;">${escapeHtml(state.session.categoryTitle)}</h1>
    <div class="sub">Tell us a little about yourself before you begin</div>
  </div>
  <div class="screen">
    <div class="card">
      <div class="field">
        <label>Full name</label>
        <input type="text" data-autofocus value="${escapeHtml(p.name)}" oninput="state.panelist.name=this.value" placeholder="Your name">
      </div>
      <div class="field">
        <label>Age</label>
        <input type="number" min="10" max="99" value="${escapeHtml(p.age)}" oninput="state.panelist.age=this.value" placeholder="Age">
      </div>
      <div class="field">
        <label>Gender</label>
        <div class="gender-row">
          ${genders.map(g=>`<button class="${p.gender===g?'active':''}" onclick="state.panelist.gender='${g}';render();">${g}</button>`).join('')}
        </div>
      </div>
      <div class="field">
        <label>Department / Section (optional)</label>
        <input type="text" value="${escapeHtml(p.dept)}" oninput="state.panelist.dept=this.value" placeholder="e.g. QA, Production">
      </div>
      <button class="btn btn-primary" data-action="submitCredentials">Start tasting</button>
    </div>
  </div>`;
}

/* ============ JOIN: pick product ============ */
function renderJoinProduct(){
  const products = state.session.products.map(p => {
    const total = p.samples.length;
    const done = (state.completed[p.name]||[]).length;
    return `<div class="choice" data-action="pickJoinProduct" data-arg="${escapeHtml(p.name)}">
      <div><div class="name">${escapeHtml(p.name)}</div><div class="meta">${done}/${total} samples scored</div></div>
      <div class="checkmark" style="border:none;">›</div>
    </div>`;
  }).join('');
  const allDone = state.session.products.every(p => (state.completed[p.name]||[]).length >= p.samples.length);
  return `
  <div class="topbar">
    <h1>Choose a product</h1>
    <div class="sub">Hi ${escapeHtml(state.panelist.name)} — what are you tasting?</div>
  </div>
  <div class="screen">
    <div class="choice-list">${products}</div>
    ${allDone ? `<button class="btn btn-gold" style="margin-top:16px;" data-action="allDone">Finish tasting</button>` : ''}
  </div>`;
}

/* ============ JOIN: pick sample ============ */
function renderJoinSample(){
  const p = state.session.products.find(p=>p.name===state.currentProduct);
  const doneCodes = state.completed[state.currentProduct]||[];
  const items = p.samples.map(s => {
    const isDone = doneCodes.includes(s.code);
    return `<div class="choice ${isDone?'selected':''}" ${isDone?'':`data-action="pickSample" data-arg="${escapeHtml(s.code)}"`}>
      <div>
        <div class="name">${escapeHtml(s.code)}</div>
        ${s.label ? `<div class="meta">${escapeHtml(s.label)}</div>` : ''}
      </div>
      <div class="checkmark ${isDone?'selected':''}">${isDone?'':''}</div>
    </div>`;
  }).join('');
  const allSamplesDone = p.samples.every(s=>doneCodes.includes(s.code));
  return `
  <div class="topbar">
    <div class="topbar-row">${state.session.products.length>1?`<button class="back-btn" data-action="goto" data-arg="joinProduct">‹ Products</button>`:''}</div>
    <h1 style="margin-top:8px;">${escapeHtml(state.currentProduct)}</h1>
    <div class="sub">Pick a sample code to evaluate</div>
  </div>
  <div class="screen">
    <div class="choice-list">${items}</div>
    ${allSamplesDone ? `<button class="btn btn-gold" style="margin-top:16px;" data-action="finishProduct">Continue</button>` : ''}
  </div>`;
}

/* ============ JOIN: scoring flow ============ */
function renderJoinScore(){
  const sections = state.session.sections;
  const sec = sections[state.activeTab];
  const tabs = sections.map((s,i)=>{
    const doneCount = s.attributes.filter(a=>a.id in state.scores).length;
    const cls = i===state.activeTab ? 'active' : (doneCount===s.attributes.length ? 'done':'');
    return `<div class="tab ${cls}" data-action="setActiveTab" data-arg="${i}">${escapeHtml(s.name)}</div>`;
  }).join('');

  const attrCards = sec.attributes.map(a => {
    const val = state.scores[a.id];
    const btns = [1,2,3,4,5].map(n => `<button class="${val===n?scoreClass(n):''}" data-action="scoreAttr" data-arg="${a.id}" data-arg2="${n}">${n}</button>`).join('');
    return `
    <div class="attr-card">
      <div class="attr-name">${escapeHtml(a.name)}</div>
      <div class="scale">${btns}</div>
      <div class="descriptors">
        <span style="flex:2;">${escapeHtml(a.low||'')}</span>
        <span style="flex:1;">${escapeHtml(a.mid||'')}</span>
        <span style="flex:2;">${escapeHtml(a.high||'')}</span>
      </div>
    </div>`;
  }).join('');

  const dots = sections.map((s,i)=>`<span class="${i<=state.activeTab?'on':''}"></span>`).join('');
  const isLast = state.activeTab === sections.length-1;
  const commentBox = isLast ? `
    <div class="field" style="margin-top:8px;">
      <label>Comments on this sample (optional)</label>
      <textarea oninput="state.comment=this.value" placeholder="Any defects or observations?">${escapeHtml(state.comment)}</textarea>
    </div>` : '';

  return `
  <div class="topbar">
    <div class="topbar-row">
      <button class="back-btn" data-action="prevTab">‹ ${state.activeTab===0?'Samples':'Back'}</button>
    </div>
    <h1 style="margin-top:8px;">${escapeHtml(state.currentProduct)} — ${escapeHtml(state.currentSample.code)}</h1>
    <div class="progress-dots">${dots}</div>
  </div>
  <div class="screen">
    <div class="tabstrip">${tabs}</div>
    <div class="section-label">${sec.letter}. ${escapeHtml(sec.name)}</div>
    ${attrCards}
    ${commentBox}
  </div>
  <div class="footer-bar">
    <button class="btn btn-primary" data-action="nextTab" ${state.submitting?'disabled':''}>${state.submitting ? 'Saving…' : (isLast ? 'Submit this sample' : 'Next: '+escapeHtml(sections[state.activeTab+1].name))}</button>
  </div>`;
}

/* ============ JOIN: done ============ */
function renderJoinDone(){
  return `
  <div class="topbar"><h1>All done</h1><div class="sub">Thank you for tasting</div></div>
  <div class="screen">
    <div class="empty">
      <div class="big">✅</div>
      <p>Your scores have been recorded for <strong>${escapeHtml(state.session.categoryTitle)}</strong>. The host can see your results now.</p>
    </div>
    <button class="btn btn-outline" data-action="startAnother">Join another session</button>
  </div>`;
}

(function init(){
  const urlSession = getUrlSession();
  if(urlSession){
    state.joinCode = urlSession;
    state.screen = 'joinCode';
    ACTIONS.loadSessionByCode();
  }
  render();
})();
</script>
